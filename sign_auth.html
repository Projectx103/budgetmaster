<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BudgetMaster - Sign Up</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- ── PWA: install + iOS home-screen support ── -->
  <meta name="theme-color" content="#2563eb">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icons/icon-512.png">

  <!-- iOS Safari doesn't fully respect manifest.json — needs its own tags -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="BudgetMaster">

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-light: #f9fafb;
      --card: #ffffff;
      --radius: 16px;
      --shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: "SF Pro Display", sans-serif; }

    body {
      display: flex;
      min-height: 100vh;
      background: var(--bg-light);
      color: #111;
    }

    /* Left Panel */
    .left {
      flex: 1;
      background: linear-gradient(135deg, #1e3a8a, #2563eb, #3b82f6);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 40px;
    }
    .left h1 { font-size: 2.5rem; font-weight: 700; margin-bottom: 15px; }
    .left p { font-size: 1.1rem; opacity: 0.9; max-width: 320px; text-align: center; }

    /* Right Panel */
    .right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-light);
      padding: 20px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 40px;
      width: 100%;
      max-width: 450px;
      box-shadow: var(--shadow);
    }

    .card h2 {
      font-size: 1.8rem;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      font-size: 0.9rem;
      font-weight: 500;
      margin-bottom: 6px;
      display: block;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
    }

    .form-row {
      display: flex;
      gap: 10px;
    }
    .form-row .form-group { flex: 1; }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 15px;
      transition: background 0.2s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-hover); }

    .switch {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
    }
    .switch a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
    }
    .switch a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      .left, .right { flex: none; height: 50%; text-align: center; }
    }
  </style>
</head>
<body>
  <div class="left">
    <h1>Create Your Account</h1>
    <p>Sign up to start managing your finances, track budgets, and rollover balances like a pro.</p>
  </div>

  <div class="right">
    <div class="card">
      <h2>Sign Up</h2>

      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" id="firstName" placeholder="First Name">
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" id="lastName" placeholder="Last Name">
        </div>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="Email Address">
      </div>

      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Create Password">
      </div>

      <div class="form-group">
        <label>Display Name</label>
        <input type="text" id="displayName" placeholder="How you'll appear in BudgetMaster">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Date of Birth</label>
          <input type="date" id="dob">
        </div>
        <div class="form-group">
          <label>Gender</label>
          <select id="gender">
            <option value="">Select Gender</option>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Currency</label>
        <select id="currency">
          <option value="PHP">PHP</option>
          <option value="USD">USD</option>
          <option value="JPY">JPY</option>
          <option value="EUR">EUR</option>
        </select>
      </div>

      <button class="btn btn-primary" onclick="signup()">Sign Up</button>

      <div class="switch">
        <span>Already have an account? <a href="auth.html">Login</a></span>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA1txE-ewGSTwVrNk7gVz3z8yLeYTdwYwk",
      authDomain: "budget-monitoringv2.firebaseapp.com",
      projectId: "budget-monitoringv2",
    };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    async function signup() {
      const firstName = document.getElementById("firstName").value.trim();
      const lastName = document.getElementById("lastName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const displayName = document.getElementById("displayName").value.trim();
      const dob = document.getElementById("dob").value;
      const gender = document.getElementById("gender").value;
      const currency = document.getElementById("currency").value;

      if (!firstName || !lastName || !email || !password || !displayName || !dob || !gender) {
        return alert("Please fill all fields");
      }

      try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const uid = userCredential.user.uid;

await db.collection("users").doc(uid).set({ // lowercase 'users'
  firstName,
  lastName,
  displayName,
  email,
  dob,
  gender,
  currency,
  approved: false, // leave false for admin approval
  createdAt: new Date().toISOString()
});

alert("✅ Account created! Await admin approval.");
window.location.href = "auth.html"; // redirect to login page

      } catch (e) {
        alert(e.message);
      }
    }
  </script>
</body>
</html>
